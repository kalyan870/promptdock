<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <rect width="900" height="650" fill="#070a12"/>
  <rect x="60" y="50" width="780" height="550" rx="16" fill="#0c111e" stroke="#1d263b" stroke-width="2"/>
  <text x="100" y="105" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="24">Kinetic Variable Typography</text>
  <text x="100" y="130" fill="#818cf8" font-family="system-ui" font-size="13">Dynamic weight skewing, letter-by-letter reveal, and gradient masking</text>
  <g transform="translate(100, 170)">
    <rect x="0" y="0" width="700" height="380" rx="16" fill="#0e1526" stroke="#1f2c45"/>
    <text x="40" y="110" fill="#5eead4" font-family="system-ui" font-weight="900" font-size="76" letter-spacing="-2px">WEBSITES</text>
    <text x="40" y="190" fill="#ffffff" font-family="system-ui" font-weight="900" font-size="76" letter-spacing="-2px">THAT MOVE.</text>
    <text x="40" y="270" fill="#64748b" font-family="monospace" font-size="14">font-variation-settings: 'wght' 900, 'ital' 1;</text>
    <text x="40" y="300" fill="#5eead4" font-family="monospace" font-size="14">transform: skewX(calc(var(--scroll-velocity) * 1.8deg));</text>
  </g>
</svg>