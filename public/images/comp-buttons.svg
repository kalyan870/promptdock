<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <rect width="900" height="650" fill="#080c16"/>
  <rect x="60" y="60" width="780" height="530" rx="16" fill="#0d1424" stroke="#1e293f" stroke-width="2"/>
  <text x="100" y="120" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="24">Interactive Button Suite</text>
  <text x="100" y="150" fill="#818cf8" font-family="system-ui" font-size="14">Border-beam, magnetic spring, and liquid glowing gradient interactions</text>
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="310" height="70" rx="16" fill="#10192e" stroke="#253554" stroke-width="2"/>
    <rect x="0" y="0" width="120" height="70" rx="16" fill="none" stroke="#5eead4" stroke-width="3.5" filter="drop-shadow(0 0 10px #5eead4)"/>
    <text x="60" y="42" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="16">Border Beam Shimmer</text>
    <text x="255" y="42" fill="#5eead4" font-family="system-ui" font-size="18">⚡</text>
  </g>
  <g transform="translate(450, 200)">
    <rect x="0" y="0" width="310" height="70" rx="35" fill="#5eead4"/>
    <text x="70" y="43" fill="#040711" font-family="system-ui" font-weight="800" font-size="16">Magnetic Cursor Pull ✦</text>
    <circle cx="280" cy="35" r="14" fill="#040711" opacity="0.15"/>
  </g>
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="310" height="70" rx="16" fill="#141e33" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="80" y="42" fill="#38bdf8" font-family="system-ui" font-weight="700" font-size="16">Glassmorphic Glow</text>
  </g>
  <g transform="translate(450, 310)">
    <rect x="0" y="0" width="310" height="70" rx="16" fill="#121829" stroke="#334155"/>
    <text x="95" y="42" fill="#f1f5f9" font-family="system-ui" font-weight="700" font-size="16">Slide Shine Sweep ➔</text>
  </g>
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="660" height="130" rx="14" fill="#090d18" stroke="#1f2c42"/>
    <text x="30" y="40" fill="#64748b" font-family="monospace" font-size="13">&lt;MagneticButton strength={0.45} glow="#5eead4"&gt;</text>
    <text x="50" y="70" fill="#5eead4" font-family="monospace" font-size="13">  &lt;BorderBeam duration={3.2} size={150} colorFrom="#5eead4" colorTo="#818cf8" /&gt;</text>
    <text x="30" y="100" fill="#64748b" font-family="monospace" font-size="13">&lt;/MagneticButton&gt;</text>
  </g>
</svg>