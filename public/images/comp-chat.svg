<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <rect width="900" height="650" fill="#080c16"/>
  <rect x="60" y="50" width="780" height="550" rx="16" fill="#0c1221" stroke="#1d263b" stroke-width="2"/>
  <text x="100" y="105" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="24">AI Copilot Chat Interface</text>
  <text x="100" y="130" fill="#5eead4" font-family="system-ui" font-size="13">Streaming markdown responses, code execution sandbox &amp; token stats</text>
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="700" height="400" rx="16" fill="#10172a" stroke="#22304d"/>
    <g transform="translate(240, 30)">
      <rect x="0" y="0" width="430" height="55" rx="16" fill="#1e293b"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui" font-size="14">Generate a 3D rotating glowing sphere with particle ring in Three.js</text>
    </g>
    <g transform="translate(30, 105)">
      <circle cx="20" cy="20" r="16" fill="#5eead4"/>
      <text x="14" y="25" fill="#040711" font-family="system-ui" font-weight="800" font-size="14">✦</text>
      <rect x="50" y="0" width="600" height="190" rx="16" fill="#131d33" stroke="#293959"/>
      <text x="75" y="32" fill="#5eead4" font-family="system-ui" font-weight="700" font-size="13">Synthesized Component Ready:</text>
      <rect x="75" y="50" width="550" height="115" rx="10" fill="#090d18" stroke="#192438"/>
      <text x="95" y="78" fill="#f87171" font-family="monospace" font-size="12">const geometry = new THREE.SphereGeometry(1.5, 32, 32);</text>
      <text x="95" y="102" fill="#60a5fa" font-family="monospace" font-size="12">const material = new THREE.MeshStandardMaterial({ wireframe: true, color: 0x5eead4 });</text>
      <text x="95" y="126" fill="#a78bfa" font-family="monospace" font-size="12">const mesh = new THREE.Mesh(geometry, material); scene.add(mesh);</text>
      <text x="95" y="150" fill="#34d399" font-family="monospace" font-size="12">// Streaming response finished (240ms · 128 tokens)</text>
    </g>
    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="640" height="56" rx="28" fill="#16223b" stroke="#2e4166"/>
      <text x="30" y="34" fill="#64748b" font-family="system-ui" font-size="14">Ask copilot to modify shaders, animate meshes, or export component...</text>
      <rect x="570" y="8" width="60" height="40" rx="20" fill="#5eead4"/>
      <text x="592" y="33" fill="#040711" font-family="system-ui" font-weight="800" font-size="16">➔</text>
    </g>
  </g>
</svg>