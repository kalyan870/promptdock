<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <rect width="900" height="650" fill="#070a12"/>
  <rect x="60" y="50" width="780" height="550" rx="16" fill="#0c111e" stroke="#1d263b" stroke-width="2"/>
  <text x="100" y="105" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="24">Three.js 3D Viewport Component</text>
  <text x="100" y="130" fill="#5eead4" font-family="system-ui" font-size="13">WebGL canvas container with orbit controls, inertia dampening &amp; fallback</text>
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="700" height="400" rx="16" fill="#090d18" stroke="#1c273e"/>
    <g transform="translate(350, 200)">
      <circle cx="0" cy="0" r="130" fill="#10172a" stroke="#5eead4" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="150" ry="50" fill="none" stroke="#818cf8" stroke-width="2" transform="rotate(30)"/>
      <polygon points="0,-80 70,-30 70,40 0,90 -70,40 -70,-30" fill="#131e33" stroke="#5eead4" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="#5eead4"/>
    </g>
    <rect x="30" y="30" width="160" height="34" rx="8" fill="#131d30" stroke="#253554"/>
    <text x="45" y="52" fill="#5eead4" font-family="system-ui" font-weight="700" font-size="12">✦ 3D ORBIT ACTIVE</text>
    <rect x="30" y="335" width="220" height="34" rx="8" fill="#131d30" stroke="#253554"/>
    <text x="45" y="357" fill="#94a3b8" font-family="system-ui" font-size="12">Rotate: Drag · Zoom: Wheel</text>
  </g>
