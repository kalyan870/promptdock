<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <rect width="1200" height="650" fill="#070a12"/>
  <text x="60" y="60" fill="#ffffff" font-family="system-ui" font-weight="800" font-size="28">PromptDock 5.0 Platform Architecture</text>
  <text x="60" y="90" fill="#818cf8" font-family="system-ui" font-size="14">Modular client-side WebGL engine, reactive DOM, motion physics, and verified registry pipelines</text>
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="340" height="460" rx="16" fill="#0e1526" stroke="#1f2d48" stroke-width="2"/>
    <text x="25" y="40" fill="#5eead4" font-family="system-ui" font-weight="800" font-size="16">1. GRAPHICS &amp; 3D ENGINE</text>
    <rect x="25" y="65" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="95" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Three.js WebGL Core</text>
    <text x="40" y="115" fill="#94a3b8" font-family="system-ui" font-size="11">Icosahedrons, Torus Knots, BufferGeometry</text>
    <rect x="25" y="145" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="175" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">IntersectionObserver Controller</text>
    <text x="40" y="195" fill="#94a3b8" font-family="system-ui" font-size="11">Pauses off-screen canvases (0% idle GPU)</text>
    <rect x="25" y="225" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="255" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">3D Perspective Tilt Physics</text>
    <text x="40" y="275" fill="#94a3b8" font-family="system-ui" font-size="11">Mouse coordinate normalizer &amp; specular glare</text>
    <rect x="25" y="305" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="335" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">WebGL Fallback Engine</text>
    <text x="40" y="355" fill="#94a3b8" font-family="system-ui" font-size="11">CSS transforms and responsive vector layers</text>
  </g>
  <g transform="translate(430, 130)">
    <rect x="0" y="0" width="340" height="460" rx="16" fill="#0e1526" stroke="#5eead4" stroke-width="2"/>
    <text x="25" y="40" fill="#5eead4" font-family="system-ui" font-weight="800" font-size="16">2. DISCOVERY &amp; REGISTRY STACK</text>
    <rect x="25" y="65" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="95" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Prompt Catalog (16 Prompts)</text>
    <text x="40" y="115" fill="#94a3b8" font-family="system-ui" font-size="11">Hero, Dashboard, Three.js, SaaS, Motion</text>
    <rect x="25" y="145" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="175" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">21st.dev Component Marketplace</text>
    <text x="40" y="195" fill="#94a3b8" font-family="system-ui" font-size="11">Heroes, navbars, buttons, bento, dynamic island</text>
    <rect x="25" y="225" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="255" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Libraries.dev Effect Registry</text>
    <text x="40" y="275" fill="#94a3b8" font-family="system-ui" font-size="11">Border beam, thinking orbs, liquid chrome</text>
    <rect x="25" y="305" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="335" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Command Palette (Ctrl + K)</text>
    <text x="40" y="355" fill="#94a3b8" font-family="system-ui" font-size="11">Global multi-entity search, fuzzy match</text>
  </g>
  <g transform="translate(800, 130)">
    <rect x="0" y="0" width="340" height="460" rx="16" fill="#0e1526" stroke="#1f2d48" stroke-width="2"/>
    <text x="25" y="40" fill="#818cf8" font-family="system-ui" font-weight="800" font-size="16">3. PRODUCTION &amp; CI/CD PIPELINE</text>
    <rect x="25" y="65" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="95" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Automated QA Suite</text>
    <text x="40" y="115" fill="#94a3b8" font-family="system-ui" font-size="11">node test-build.js (100% assertions)</text>
    <rect x="25" y="145" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="175" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">GitHub Actions Matrix</text>
    <text x="40" y="195" fill="#94a3b8" font-family="system-ui" font-size="11">Node 18.x, 20.x, 22.x verification</text>
    <rect x="25" y="225" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="255" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Vercel Global Edge Network</text>
    <text x="40" y="275" fill="#94a3b8" font-family="system-ui" font-size="11">Immutable asset caching (31536000s)</text>
    <rect x="25" y="305" width="290" height="65" rx="10" fill="#141e33"/>
    <text x="40" y="335" fill="#ffffff" font-family="system-ui" font-weight="700" font-size="13">Zero-Downtime Releases</text>
    <text x="40" y="355" fill="#94a3b8" font-family="system-ui" font-size="11">Atomic alias swap to production domain</text>
  </g>
